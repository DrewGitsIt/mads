<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: the copper "m" tile from docs/ux-prototype.html (.logo),
       on the macOS icon grid (824px tile, 100px margin for the drop shadow).
       Colors are tokens.css's default theme: --accent #c08552 on the window
       background #1A1713. Regenerate the .icns/.png with scripts/make-icon.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b241d"/>
      <stop offset="1" stop-color="#1a1713"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3945e"/>
      <stop offset="1" stop-color="#b1743f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="106" y="106" width="812" height="812" rx="179" fill="none"
        stroke="#c08552" stroke-opacity="0.4" stroke-width="12"/>
  <text x="512" y="512" dy="0.27em" text-anchor="middle" fill="url(#ink)"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="700"
        font-size="600">m</text>
</svg>
