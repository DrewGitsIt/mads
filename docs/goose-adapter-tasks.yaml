# goose adapter (proposed W7.8) — seed with:
#   SES=$(bin/mads new-session -name "goose adapter")
#   bin/mads seed -session $SES -file docs/goose-adapter-tasks.yaml
#
# Design doc: docs/GOOSE-ADAPTER-DESIGN.md — every task references its
# sections; read it before starting any task. goose 1.46.0 is installed at
# ~/.local/bin/goose with a working local ollama provider (qwen3.8), so
# empirical probes and smokes are free — no cloud LLM needed. The goose
# source is checked out at ~/repo/goose for cross-checking wire behavior
# (see the design doc's "Stance: goose is malleable" section).
#
# Package tasks (wire → session → oneshot → pty → transcript → conformance)
# are deliberately CHAINED, not parallel: they touch the same files in
# providers/goosecli/ and the pipeline's serialized merges block loudly on
# conflicts. Parallelism comes from the preflight and upstream-proposal
# tracks.

tasks:
  - title: "Pin remaining goose wire facts; commit sanitized captures as testdata"
    description: >
      Resolve the design doc's two open wire questions and turn every claim
      the adapter will rely on into a committed capture. Using the installed
      goose binary (local ollama provider — free), capture: (1) a full
      `goose run -q --output-format stream-json` run with a tool-using prompt
      (e.g. "create a file /tmp/x and tell me you did") — determine whether a
      session-id line appears anywhere in the stream, and pin the tool
      request/result content-block shapes; (2) `goose session export
      --session-id <ref> --format json` for that same session — pin the tool
      block shapes in `conversation[]` and the top-level usage fields; (3) an
      ACP stdio transcript covering initialize → session/new →
      session/set_mode → session/set_config_option(model) →
      _goose/unstable/session/system-prompt/set → session/prompt with a tool
      call in "approve" mode (capturing the session/request_permission
      request and a valid reply) → session/cancel mid-turn → session/load
      replay; (4) the `goose session` PTY startup banner bytes. Sanitize
      (hostnames, absolute homedirs) and commit under
      providers/goosecli/testdata/captures/ with a README describing how each
      was produced. Update docs/GOOSE-ADAPTER-DESIGN.md where a capture
      contradicts or completes the design (especially the "OneShot" ref
      strategy and both "executor: pin" notes), and record whether the
      one-shot ref seam needs the --name fallback.
    acceptance_criteria: >
      providers/goosecli/testdata/captures/ exists with the four capture sets
      and a provenance README. The design doc's "Risks / open questions"
      section no longer lists the one-shot ref line or tool-block shapes as
      unpinned — each is either resolved with a cited capture or documented
      as a confirmed gap with the fallback committed to. No Go code in this
      task. make check passes (docs/testdata only).
    labels: [goose, provider, research]

  - title: "goosecli core: ACP wire types + interactive session"
    description: >
      Create providers/goosecli: Config/New/Name/env/closeWait in
      goosecli.go (mirror providers/kirocli/kirocli.go, binary "goose",
      registry name "goose", agentenv.Build for all spawns, Config.Builtins
      defaulting to ["developer"] appended as --with-builtin), wire.go with
      RPC types derived from the official ACP v1 schema
      (agentclientprotocol.com / agent-client-protocol-schema 1.5.0 crate —
      the spec is normative; the committed captures are evidence of goose's
      behavior within it, and any capture/spec disagreement is an upstream
      goose bug for T10) and verified against the captures: parse all five
      spec stopReasons even though goose emits three (cancelled →
      Interrupted; refusal → EventError then turn end;
      max_tokens/max_turn_requests/unknown → plain turn end), skip
      unrecognized sessionUpdate variants silently (plan/plan_removed are
      official v1 variants goose never emits today), and quarantine
      extensions — _meta.goose.* parsing in one gooseMeta type,
      _goose/unstable/* calls in named helpers — so extension use stays
      greppable (goose-specific shapes:
      _meta.goose.toolCall{toolName,extensionName}, four-option permission
      requests, usage on the session/prompt result, usage_update/
      session_info_update/available_commands_update variants), and session.go
      implementing the ACP session per the design doc's "ACP session
      lifecycle" and "session/update → Event mapping" sections: initialize
      with fs capabilities false, session/new vs session/load (replaying
      flag), set_mode from Trust (auto for full; approve + toolName
      allowlist gating with unknown-deny for limited/read_only, replying
      by selecting from the request's offered options array the option
      whose kind is allow_once/reject_once — per spec optionIds are
      agent-chosen opaque strings, so never hardcode them (goose's ids
      merely mirror the kind names); fall back to the _always option of
      the same polarity, else outcome cancelled),
      set_config_option for StartOptions.Model,
      the unstable system-prompt append with first-Send-prefix fallback,
      async session/prompt turn end with stopReason/usage mapping,
      session/cancel interrupt, best-effort session/close then closeWait.
      Start returns ErrUnsupported for ModePTY for now (later task).
      Include a scripted fakegoose stand-in (pattern:
      providers/kirocli/fakekiro_test.go) speaking the captured shapes, and
      unit tests for the session lifecycle, trust gating (including
      unknown-tool deny and the text_editor view-vs-write split), error
      surfaces (auth_required -32000, credits_exhausted data, concurrent
      prompt), and the system-prompt fallback. Do NOT add the conformance
      suite yet — that lands with the finished matrix.
    acceptance_criteria: >
      go test -race ./providers/goosecli/... passes with no goose binary
      required. Session unit tests prove: ref set at Start-return; text and
      tool_call updates normalize to EventText/EventToolUse with toolName as
      Name; tool_call_update failed → EventToolResult IsError; turn end
      carries Usage and Interrupted on cancelled; limited trust denies
      developer__shell and unknown tools but allows text_editor view;
      read_only additionally denies text_editor write. Wire decoding
      tolerates a plan sessionUpdate and an unrecognized stopReason without
      erroring, and permission replies pick optionId from the offered
      options by kind (proved with a fakegoose script whose optionIds do
      NOT mirror the kind names). make check passes.
    depends_on:
      - "Pin remaining goose wire facts; commit sanitized captures as testdata"
    labels: [goose, provider]

  - title: "goosecli OneShot, OneShotStream, and model discovery"
    description: >
      Implement Provider.OneShot per the design doc's "OneShot" section:
      goose run -q --output-format stream-json -t <prompt> with --system /
      --model when set, cwd, agentenv.Build. Parse the stream per the
      committed captures: text blocks → accumulated result text +
      OnEvent(EventText); thinking blocks skipped; tool blocks →
      OnEvent(EventToolUse). Ref attribution per whichever strategy task 1
      pinned (stream line, or --name mads-<random> resolved via `goose
      session list --format json`) — emit EventSessionRef when known and set
      OneShotResult.Ref. Fill OneShotResult.Usage from the stream if present,
      else from `goose session export` (design doc "OneShot" bullet). Rate
      limits: conservative stderr/stdout phrase heuristic returning
      *provider.RateLimitError, marked guess-grade in comments. Implement
      ModelDiscoverer per the design doc's ModelDiscovery row: spawn goose
      acp, initialize, session/new in a temp dir, read the model
      configOption (currentValue → Default), session/close; exec/parse
      failures wrap provider.ErrDiscoveryUnavailable, never a silent static
      fallback (kirocli Models() precedent). Extend fakegoose to script the
      run and discovery paths.
    acceptance_criteria: >
      Unit tests against fakegoose prove: OneShot returns final text with
      OnEvent firing incrementally (text + tool events, thinking dropped);
      Ref lands on the result and EventSessionRef fires; Usage populated;
      rate-limit output returns the typed error; Models() returns the
      scripted list with the default flagged and wraps
      ErrDiscoveryUnavailable on exec failure. make check passes.
    depends_on:
      - "goosecli core: ACP wire types + interactive session"
    labels: [goose, provider]

  - title: "goosecli PTY transport with banner ref announce"
    description: >
      Implement the terminal transport per the design doc's "PTY" section:
      `goose session` (or --resume --session-id <ref>) under creack/pty,
      mirroring providers/kirocli/pty.go — Events() nil, Terminal(), Resize,
      Send injects a line, Interrupt writes 0x03, Close via closeWait. Ref
      discovery: match the session id in the startup banner using the
      committed banner capture (pin the regex against those exact bytes) and
      deliver it via the RefAnnouncer channel contract (exactly one
      non-empty ref then close, or close empty if the banner never matched —
      see providers/provider/provider.go RefAnnouncer doc). Wire ModePTY
      into Start's switch. Extend fakegoose with a PTY-mode script that
      prints a real captured banner.
    acceptance_criteria: >
      Unit tests prove: a PTY session's RefAnnounced delivers the banner's
      session id and closes; a banner-less script closes the channel without
      a value (never blocks); Send/Interrupt bytes reach the child;
      Start(ModePTY) returns a working PTYSession. make check passes.
    depends_on:
      - "goosecli OneShot, OneShotStream, and model discovery"
    labels: [goose, provider]

  - title: "goosecli Transcript and SessionLocator via session export/list"
    description: >
      Implement TranscriptReader per the design doc's "Transcript
      normalization" section: `goose session export --session-id <ref>
      --format json` → []provider.Message — skip metadata.userVisible==false
      entries and thinking blocks, map text/tool request/tool result blocks
      per the committed capture, unix `created` → Timestamp. Golden-pin the
      normalization against the committed capture (pkg/golden, claudecode
      transcript convention). Implement SessionLocator per the design doc:
      `goose session list --format json` filtered by working_dir == cwd and
      created_at >= spawnedAfter, candidate verified by first visible user
      message via export; 0 or 2+ candidates, timeout, or cancellation ⇒
      ok=false — never guess (provider.go contract). Implement RefSetter on
      the PTY session so a located ref becomes visible on the live session.
    acceptance_criteria: >
      Golden test pins the normalized transcript from the committed export
      capture (turn-context entries absent, timestamps populated, tool
      result IsError mapping covered). Locator unit tests cover: exactly-one
      match verified and returned; ambiguous (two candidates) declines;
      wrong-first-message declines; SetRef propagates to Ref(). make check
      passes.
    depends_on:
      - "goosecli PTY transport with banner ref announce"
    labels: [goose, provider]

  - title: "goosecli conformance suite, capability matrix finalization, README"
    description: >
      Land the honest §11 matrix from the design doc's "Proposed capability
      matrix" (verify CostReporting's Native claim against what the
      session/prompt capture actually showed — downgrade to Emulated with
      the export-delta mechanism if usage was absent) plus the all-
      Unsupported IntentMatrix, and wire conformance.Run(t, …) against the
      fakegoose stand-in so CI proves every row with no binary installed
      (pattern: providers/kirocli/kirocli_test.go). Add MCPServers wiring if
      not already present: StartOptions.MCPServers → session/new mcpServers
      stdio entries (ACP) and --with-extension (one-shot), with the
      config-suppression caveat (mcpServers suppresses config.yaml
      extensions on <=1.46 only; 1.48 unions them -- see the design doc's
      1.48 re-verification note) handled by the always-on --with-builtin
      developer, which is correct on both versions. Write providers/goosecli/README.md in the kirocli
      convention — matrix row by row, but citing committed captures and
      goose source files instead of docs research — including the trust
      tool-name table with provenance, the mcpServers/extension-suppression
      caveat, the unstable system-prompt dependency, and the upstream-seam
      list from the design doc's malleability section. Update
      providers/README.md with the goosecli bullet.
    acceptance_criteria: >
      go test -race ./providers/... passes; conformance.Run exercises the
      full declared matrix against fakegoose with zero real-binary
      dependency; Matrix().Validate() passes; README justifies all 16 rows
      with capture/source citations. make check passes.
    depends_on:
      - "goosecli Transcript and SessionLocator via session export/list"
    labels: [goose, provider]

  - title: "Preflight and compat rows for goose"
    description: >
      Add goose to pkg/preflight/providers.go (binary "goose", version probe
      `goose --version` — note the output has a leading space before the
      version: " 1.46.0") and pkg/preflight/compat.go (proven range
      1.46-1.48: binary-verified at 1.46.0, source-verified at 1.48.0 —
      the 1.46->1.48 deltas are listed in the design doc's re-verification
      note; the version-sensitive surfaces are the _goose/unstable
      system-prompt method, --output-format stream-json, and the ACP
      configOptions shape — cite docs/GOOSE-ADAPTER-DESIGN.md). Follow the existing claude-code /
      kiro-cli row conventions in both files and their tests. This task
      touches pkg/preflight only — it deliberately does not depend on the
      adapter package and can run in parallel with it.
    acceptance_criteria: >
      Preflight detects an installed goose binary and parses its version
      (unit test with a scripted stand-in covering the leading-space
      output); compat declares the proven 1.46-1.48 range with rationale
      comments citing the design doc's re-verification note. make check
      passes.
    depends_on:
      - "Pin remaining goose wire facts; commit sanitized captures as testdata"
    labels: [goose, preflight]

  - title: "Register goose across services and the mads run CLI"
    description: >
      Register the goosecli provider everywhere the design doc's
      "Registration & plumbing" checklist names: services/router/main.go,
      services/session/main.go, services/pipeline/main.go (mirror the
      kirocli registration blocks exactly — Config with Env/EnvMode/
      EnvPassthrough threading), and cmd/mads/run.go's -provider switch
      (accept "goose", add -goose-args following the -claude-args/-kiro-args
      convention; pick a sensible default and document why — goose has no
      skip-permissions flag; full trust rides mode "auto" which the adapter
      sets itself, so the default is likely empty). Confirm /providers,
      /providers/behaviors, and /providers/{name}/models serve goose rows
      via the registry with no handler changes.
    acceptance_criteria: >
      All three services register goose at startup and their existing
      registration tests (or new ones matching the kirocli pattern) cover
      it; `mads run -provider goose` resolves the adapter; router API lists
      goose with its behavior matrix. make check passes.
    depends_on:
      - "goosecli conformance suite, capability matrix finalization, README"
      - "Preflight and compat rows for goose"
    labels: [goose, services, cli]

  - title: "Real-binary goose smoke test and docs wrap"
    description: >
      Add the MADS_GOOSE_SMOKE=1 opt-in smoke (convention:
      MADS_CLAUDE_SMOKE/MADS_KIRO_SMOKE) — unlike kiro, the binary IS
      installed here with a free local ollama model, so actually run it:
      assert protocol mechanics only, never model output content (ref format
      matches ^\d{8}_\d+$, turn ends, usage present per the declared
      CostReporting row, export parses through the transcript normalizer,
      interrupt leaves the session serving another turn). Record smoke
      results in providers/goosecli/README.md (replacing any "unverified"
      hedges — this adapter's claims are capture-backed, keep it that way).
      Add a goose row to the README.md provider table at repo root if one
      exists, and a W7.8 entry to docs/MADS-WORK-ITEMS.md pointing at
      docs/GOOSE-ADAPTER-DESIGN.md. Check ui/src/router/modelDisplay.ts
      context-window handling for goose's local models (the ACP usage_update
      capture reported size 128000 for qwen3.8) and either add entries to
      both static tables (contextwindow.go + modelDisplay.ts, kept in sync
      by hand per their comments) or file the ContextWindowReporter
      follow-up in the design doc's Future work.
    acceptance_criteria: >
      MADS_GOOSE_SMOKE=1 go test ./providers/goosecli/... passes against the
      real binary on this machine; without the env var the suite is
      unchanged. Work-items doc carries W7.8. Context-window decision is
      recorded (entries added or follow-up filed). make check passes.
    depends_on:
      - "Register goose across services and the mads run CLI"
    labels: [goose, provider, docs]

  - title: "Draft upstream goose proposals for the awkward seams"
    description: >
      goose is open source and locally checked out (~/repo/goose) — the
      design doc's "Stance: goose is malleable" section names three seams
      the adapter currently bridges with workarounds. Using the committed
      captures and the adapter session code as evidence, write
      docs/goose-upstream-proposals.md: one section per seam — (1) populate
      ACP tool-call `kind` for goose builtins in
      crates/goose/src/acp/server/tool_calls/conversion.rs (goose already
      knows toolName/extensionName; include the concrete kind mapping the
      trust gate wants); (2) a stable per-session system-prompt surface
      (promote _goose/unstable/session/system-prompt/set or a session/new
      param); (3) a session-id announcement in `goose run --output-format
      stream-json` if task 1 confirmed none exists (drop this section if it
      does). Each section: current behavior with capture citation, what mads
      does today as the workaround, the proposed upstream change with
      pointers into the goose source, and which adapter code becomes
      deletable if accepted. These are issue/PR-ready drafts committed to
      mads docs — actually filing or patching goose happens outside this
      pipeline.
    acceptance_criteria: >
      docs/goose-upstream-proposals.md exists with a capture-cited,
      source-pointed, issue-ready section per confirmed seam, each naming
      the adapter workaround it would delete. No changes outside docs/.
      make check passes.
    depends_on:
      - "goosecli core: ACP wire types + interactive session"
    labels: [goose, research, docs]
