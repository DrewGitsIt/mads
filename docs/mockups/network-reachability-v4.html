<!doctype html>
<!--
  mads — Mesh setup and Settings → Paired devices, v4 (the approved mockup; v1–v3 are in git history)
  =======================================================================================================
  Spec: docs/MESH-NETWORK-DESIGN.md. Extends the approved
  paired-devices-v3.html: same tokens (clay, dark + light), class naming (<Module>_<class> = `styles.class`
  in <Module>.module.css), table, verb sentence, Lets this…, Show sessions, Advanced options, Pair /
  Introduce, Remove device, Device activity. Open from disk.

  What v2 changes (Drew's notes)
  - #1 Onboarding first: "Set up mesh" (empty state) → 1 How will your devices reach each other? →
    2 This device is ready → 3 Add your devices (mads devices found on that network, or a pairing code)
    → 4 the other device approves, and both screens confirm the same check code. Both ends are modelled (I am MacBook / pop-os).
  - #3 The network is ONE setting for this device ("Mesh network"), chosen first. It is where this device
    accepts connections, never a per-paired-device choice. More than one network is an advanced option.
  - #2 No addresses in the default view. Status is Connected / Offline / Not reachable from this network,
    with "via Tailscale · 38 ms" only in the tooltip. Addresses live under the row's "Troubleshoot
    connection", which opens by itself only when something is wrong.
  - #4 Only mads devices appear in Add devices: a device is findable only while its own setup / Add devices
    window is open (mDNS `_mads._tcp` on a LAN; a probe of tailnet peers on Tailscale). Cameras never are.

  The striped bar is mockup-only: Theme · I am (MacBook-Air / pop-os) · Start (Fresh: nothing set up /
  Meshed: both set up and paired) · Tailscale (present / absent) · MacBook on (Home / Campus Wi-Fi) ·
  pop-os offline · and dashed MOCKUP strips inside dialogs.

  States and how to reach them
  ----------------------------
    Empty state ........................ Start: Fresh (either device).
    Onboarding, both ends .............. Fresh → I am pop-os → Set up mesh → Tailscale → Continue → Add devices
                                         (pop-os is now findable) → I am MacBook-Air → Set up mesh → Tailscale →
                                         Continue → Add devices → pop-os → Add → I am pop-os: approve (check code)
                                         → I am MacBook-Air: "Yes, the same number" → Added, choose what pop-os may do here → Done.
                                         Shortcut: in the MacBook's Add devices, "pop-os opens its setup".
    None of these ...................... Fresh, Tailscale absent, MacBook on Campus Wi-Fi → Set up mesh.
                                         "None of these" is always the last choice.
    Shared-network warning ............. Campus Wi-Fi in step 1 (a network anyone on campus is on).
    Steady state ....................... Start: Meshed.
    Not reachable from this network .... Meshed, MacBook on Campus Wi-Fi + Tailscale absent (pop-os row opens
                                         Troubleshoot connection by itself).
    Offline ............................ Meshed, pop-os offline.
    Mesh network not available here .... Meshed, Tailscale absent (the Mesh network card warns).
    Change / more than one network ..... Mesh network → Change…, or Advanced options → Use more than one network.
    Pairing code fallback .............. Pair with a code (copy on one device, paste on the other).

  Block → TSX
  -----------
    existing (v3, built) ... .App_* .IconRail_* .SettingsSurface_* .SettingsCard_* .SettingRow_* .Button_* .Switch_*
                             .Select_* .SegmentedControl_* .Chip_* .Banner_* .Tooltip_* .Fingerprint_* .Dialog_*
                             .Toast_* .TableC_* .VerbPicker_* .LevelChoice_* .Activity_* .Pairing_* .Disclosure_*
    .MeshEmpty_* ........... NEW sections/paired/MeshEmptyState.tsx (no mesh network chosen yet)
    .Setup_* ............... NEW sections/paired/setup/MeshSetup.tsx (the wizard shell + steps):
                               ChooseNetwork.tsx (step 1, also "Change…"), NoSharedNetwork.tsx ("None of these"),
                               SetupReady.tsx (step 2), AddDevices.tsx (step 3, the found list)
    .NetChoice_* ........... NEW sections/paired/setup/NetworkChoice.tsx (one radio/check card)
    .Found_* ............... NEW sections/paired/setup/FoundDevice.tsx (a found mads device + its pairing state)
    .CheckCode_* ........... NEW components/CheckCode (the 6-digit code both screens show)
    .MeshNetwork_* ......... NEW sections/paired/MeshNetworkCard.tsx (the one setting; Change…; Advanced options)
    .Reach_* / .PathList_* . NEW sections/paired/TroubleshootConnection.tsx (in DeviceDetails, behind a Disclosure)
    approve prompt ......... pairing/PairRequestPrompt.tsx, + CheckCode for discovered requests
    Status column .......... model.ts statusCell(): Connected (tooltip: via <network> · ms) / Offline /
                             Not reachable from this network / Doesn't let this <host> use mads

  Data: GET /devices/self.mesh {networks[{id, title, kind, chosen, available}], discoverable_until};
  PUT /devices/settings {networks, tailnet_check, public}; GET /devices/discovered (found mads devices);
  POST /devices/discovered/{fp}/request → {check_code}; pair requests carry check_code; GET /devices rows add
  path (tooltip only) and addresses (Troubleshoot only).
-->

/* ===== tokens.css (shared) ===== */

/* ===== palettes.css: clay light ===== */

/* ===== styles/global.css ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { accent-color: var(--accent); margin: 0; background: var(--bg0); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }

}

/* ===== Popover.module.css ===== */

/* ===== Toast.module.css ===== */

.Toast_ok { border-left-color: var(--ok); }
.Toast_warn { border-left-color: var(--warn); }

/* ===== Dialog shell: ProfileSwitchDialog.module.css / ConfirmDialog.module.css ===== */

.Dialog_dialog { display: flex; flex-direction: column; gap: var(--space-3); width: 560px; max-width: calc(100vw - var(--space-6)); max-height: calc(100vh - var(--space-6)); overflow-y: auto; background: var(--bg1); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: var(--space-4); }
.Dialog_confirm { width: 420px; }
.Dialog_title { font: 650 var(--fs-ui) var(--sans); color: var(--text); }

.Dialog_description p + p { margin-top: var(--space-2); }

.Dialog_actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-2); }
.Dialog_actionsStart { margin-right: auto; }
.Dialog_sectionTitle { font: 600 var(--fs-chip) var(--sans); color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: var(--space-1); }

/* ===== NEW PairedDevicesSection.module.css (from DevicesSection.module.css) ===== */
.PairedDevices_panel { display: flex; flex-direction: column; gap: var(--space-4); }

.DeviceRow_name { font: 600 var(--fs-ui) var(--sans); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.DeviceRow_cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: var(--space-2) var(--space-3); border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: var(--bg0); }
.DeviceRow_cellHead { display: flex; align-items: center; gap: 6px; color: var(--text3); font: 600 var(--fs-chip) var(--sans); letter-spacing: .05em; text-transform: uppercase; }

.DeviceRow_cellBody .LevelPicker_root { width: 132px; flex: none; }
.DeviceRow_cellNote { color: var(--text3); font-size: var(--fs-sm); line-height: 1.4; min-width: 0; }

.DeviceRow_status { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: var(--fs-sm); min-width: 0; }
.DeviceRow_link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.DeviceRow_facts { display: grid; grid-template-columns: 110px 1fr; gap: 6px var(--space-3); padding: var(--space-2) var(--space-3) var(--space-3); font-size: var(--fs-sm); }
.DeviceRow_facts dt { color: var(--text3); }

.DeviceRow_actions { display: flex; gap: var(--space-2); align-items: center; }
.DeviceRow_actionsNote { color: var(--text3); font-size: var(--fs-sm); }

/* ===== NEW Fingerprint.module.css ===== */
.Fingerprint_chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border: 1px solid var(--line-soft); border-radius: 4px; background: transparent; color: var(--text3); font: 500 11px var(--mono); letter-spacing: .02em; white-space: nowrap; }

.Fingerprint_row { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); }

/* ===== NEW RecentActions.module.css ===== */
.RecentActions_list { list-style: none; padding: var(--space-1) var(--space-3) var(--space-2); margin: 0; display: flex; flex-direction: column; }
.RecentActions_item { display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); padding: 5px 0; font-size: var(--fs-sm); color: var(--text2); border-top: 1px solid var(--line-soft); }
.RecentActions_item:first-child { border-top: 0; }
.RecentActions_item time { color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.RecentActions_item q { quotes: "\201C" "\201D"; color: var(--text); }
.RecentActions_item .Chip_chip { margin-right: 6px; vertical-align: 1px; }
.RecentActions_empty { padding: var(--space-2) var(--space-3) var(--space-3); color: var(--text3); font-size: var(--fs-sm); }

/* ===== NEW Pairing*.module.css ===== */
.Pairing_choices { display: flex; flex-direction: column; gap: var(--space-2); }
.Pairing_choice { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space-3); align-items: center; width: 100%; text-align: left; padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg0); color: var(--text); }
.Pairing_choice:hover:not(:disabled) { border-color: var(--text3); background: var(--bg2); }

.Pairing_choiceIcon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--bg3); color: var(--text2); font: 700 13px var(--mono); }
.Pairing_choiceTitle { font: 600 var(--fs-ui) var(--sans); }

.Pairing_codeBox { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-3) var(--space-3); border: 1px solid var(--line); border-radius: var(--r); background: var(--bg0); }

.Pairing_timer { width: 220px; height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
.Pairing_timer i { display: block; height: 100%; background: var(--accent); transform-origin: left; transition: transform 1s linear; }
.Pairing_timerText { color: var(--text3); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.Pairing_field { display: flex; flex-direction: column; gap: 6px; }

.Pairing_label { font: 500 var(--fs-body) var(--sans); color: var(--text); }
.Pairing_help { color: var(--text3); font-size: var(--fs-sm); line-height: 1.45; }
.Pairing_codeInput { font: 600 22px var(--mono); letter-spacing: .18em; text-align: center; padding: 8px 10px; width: 200px; }
.Pairing_error { color: var(--bad-fg); font-size: var(--fs-sm); }
.Pairing_grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.Pairing_who { display: flex; align-items: center; gap: var(--space-2); }
.Pairing_compare { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }
.Pairing_ask { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--line-soft); border-radius: var(--r-sm); background: var(--bg0); }
.Pairing_askRow { display: flex; align-items: center; gap: var(--space-3); }
.Pairing_askRow .LevelPicker_root { width: 150px; }
.Pairing_askText { flex: 1; min-width: 0; }

.Pairing_raise { display: flex; gap: var(--space-2); color: var(--warn-fg); font-size: var(--fs-sm); line-height: 1.45; }

.Pairing_spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--bg4); border-top-color: var(--accent); animation: Pairing_spin .8s linear infinite; flex: none; }

/* ===== NEW IntroductionRules.module.css ===== */
.Rules_list { list-style: none; margin: 0; padding: 0 var(--space-4); }
.Rules_item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--line-soft); color: var(--text2); }

.Rules_empty { padding: var(--space-2) var(--space-4) 0; color: var(--text3); font-size: var(--fs-sm); }

.SessionWorkspace_workspace { display: flex; flex-direction: column; height: 100%; min-height: 0; min-width: 0; flex: 1; background: var(--bg0); }

.SessionWorkspace_tab { position: relative; display: flex; align-items: center; background: none; border: 0; color: var(--text2); font: 500 var(--fs-sm) var(--sans); padding: 7px 14px 9px; border-radius: var(--r-sm) var(--r-sm) 0 0; }

.ConversationTab_stream { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
.ChatRenderer_stream { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); max-width: 980px; width: 100%; margin: 0 auto; }
.ChatRenderer_user, .ChatRenderer_agent { display: flex; min-width: 0; gap: var(--space-2); align-items: flex-end; }
.ChatRenderer_user { justify-content: flex-end; }
.ChatRenderer_stamp { flex: none; padding-bottom: 2px; font: var(--fs-chip) var(--mono); color: var(--text3); white-space: nowrap; opacity: 0; transition: opacity 120ms ease; }

.ChatRenderer_prose { max-width: var(--measure-prose); min-width: 0; overflow-wrap: break-word; font: var(--fs-chat) var(--sans); color: var(--text); line-height: 1.6; }
.ChatRenderer_prose p + p { margin-top: .6em; }
.ChatRenderer_prose code { font: var(--fs-chat-code) var(--mono); background: var(--bg2); border-radius: 3px; padding: 1px 4px; }
.ChatRenderer_user .ChatRenderer_prose { background: var(--accent-soft); border-radius: var(--r); padding: var(--space-2) var(--space-3); }

.SendDelivery_failed { display: flex; align-items: center; gap: var(--space-2); max-width: 100%; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
.SendDelivery_failedLabel { flex: none; font-weight: 600; color: var(--bad-fg); }
.SendDelivery_attempts { padding: 0; border: none; background: none; color: var(--text3); font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.SendDelivery_attempts:hover { color: var(--text2); }
/* NEW RefusedSend: the mesh refusal's plain reason (sans, not the harness's mono error) and its Why panel. */
.RefusedSend_line { flex-wrap: wrap; justify-content: flex-end; row-gap: 0; }

.RefusedSend_detail { width: min(520px, 100%); padding: var(--space-3); border: 1px solid var(--line-soft); border-left: 3px solid var(--bad); border-radius: var(--r-sm); background: var(--bg1); color: var(--text2); font-size: var(--fs-sm); line-height: 1.5; text-align: left; }

.RefusedSend_detail li + li { margin-top: 2px; }

.SessionDock_dock { position: relative; flex: none; background: var(--bg1); }

/* ModelsSection.module.css .disclosure/.summary → components/Disclosure */

.Disclosure_body .Fingerprint_full, .SideSheet_body .Fingerprint_full { grid-template-columns: repeat(4, auto); font-size: 11.5px; }

/* Tooltip / InfoTip (NEW components/Tooltip) */
.Tooltip_anchor { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.Tooltip_anchor:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.Tooltip_tip { position: absolute; z-index: 60; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 2px); width: max-content; max-width: 300px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg3); box-shadow: var(--shadow); color: var(--text); font: 400 var(--fs-sm)/1.45 var(--sans); text-align: left; white-space: normal; letter-spacing: 0; text-transform: none; opacity: 0; pointer-events: none; transition: opacity var(--dur-fast), transform var(--dur-fast); }

.Tooltip_start:hover > .Tooltip_tip, .Tooltip_start:focus-visible > .Tooltip_tip, .Tooltip_start:focus-within > .Tooltip_tip { transform: none; }

<script>
"use strict";
/* ================================================================ data == */
const PLATFORM_KIND = { macOS: "computer", Linux: "computer", Windows: "computer", iOS: "phone", Android: "phone" };

const LEVELS = ["none", "view", "chat", "control", "admin"];

};
const ADDR = { mac: { tailscale: "100.88.12.3", "lan:home": "192.168.1.31", "lan:campus": "10.20.31.7", "public6:home": "[2601:646:8a00:1f2::31]" },

function peer(dev, o) {
  return Object.assign({ dev, level: "none", chat: "allowed", maxTrust: "", viewed: false, lastSeen: "never", pairedAt: "Nov 17" }, o);
}
const L = (dev, type, text, t) => ({ dev, type, text, t });

      } : { peers: [], log: [] },
      pop: meshed ? {
        peers: [peer("mac", { level: "control", lastSeen: "2 min ago", pairedAt: "Nov 17, 21:40" }), peer("iphone", { level: "chat", lastSeen: "5 min ago", pairedAt: "Nov 18, 08:12" })],
        log: [L("iphone", "paired", `paired with a pairing code; may chat with`, "Nov 18"), L("mac", "paired", `found on Tailscale and approved; may control`, "Nov 17"), L(null, "network", `mesh network set to <b>Tailscale</b>, by this device`, "Nov 17")],
      } : { peers: [], log: [] },
    },
  };
}
let S = seed();
/* ============================================================= helpers == */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const nm = (dev) => (dev ? DEV[dev].name : "This device");
const hw = (dev = me()) => DEV[dev].short || DEV[dev].name; // "this MacBook-Air", "this pop-os"

/* What this device's Mesh Service detects now. */
function detected(dev) {

const RANK = { lan: 10, overlay: 20, public: 30 };
const tsOut = (dev) => dev === "pop" && S.popTs === "signedout";

/* F3: v dials h's networks that v is on now; the first pinned handshake wins (lan before overlay). */
function race(v, h) {
  const cands = chosen(h).map((id) => {
    let st;
    if (!isOn(v, id)) st = "off";
    else if (!listensNow(h).includes(id)) st = "bad";
    else st = "ok";
    const rtt = NET[id].kind === "lan" ? 4 : NET[id].kind === "overlay" ? (S.macAt === "campus" ? 38 : 9) : 22;
    return { id, addr: `${ADDR[h][id]}:${PORT}`, label: title(h, id), kind: NET[id].kind, r: { st, rtt } };
  }).sort((a, b) => RANK[a.kind] - RANK[b.kind]);
  const win = cands.find((c) => c.r.st === "ok");
  const state = win ? "connected" : cands.every((c) => c.r.st === "off") ? "not_here" : "offline";
  return { cands, win, state };
}
function reach(hostKey, p) {

  const rec = findPeer(p.dev, hostKey);
  if (!rec || rec.level === "none") return { state: "denied", race: r };
  return { state: "connected", race: r, rtt: r.win.r.rtt, word: NET[r.win.id].word };
}
const problem = (p) => { const r = reach(me(), p); return !!r && (r.state === "not_here" || r.state === "offline" || (tsExpiring(p.dev) && r.state === "connected")); };

  let r = {};
  if (t && !m) r.error = "That isn’t a mads pairing code. Copy the whole line from the other device.";
  else if (m) { try { const o = unb64url(m[2]); r.dev = Object.keys(DEV).find((k) => DEV[k].fp === o.f); r.nets = o.a.map((a) => a.l); r.ids = o.a.map((a) => a.n); r.via = r.ids.find((id) => isOn(me(), id) && !(r.dev === "pop" && S.popOffline)); } catch (e) { r.error = "That code is damaged."; } }
  if (r.dev === me()) { r = { error: "That’s this device’s own pairing code." }; }
  const already = r.dev && findPeer(me(), r.dev);
  const fill = () => { d.text = makeCode(other()); render(); };
  return dialogShell("Paste a pairing code",
    `<div class="Pairing_field"><label class="Pairing_label" for="paste-code">Pairing code from the other device</label>
      <textarea id="paste-code" class="settingInput_input settingInput_mono Pairing_textarea" spellcheck="false" placeholder="mads-pair-2:…" data-input="text" data-autofocus>${esc(d.text)}</textarea>
      ${r.error ? `<p class="Pairing_error" role="alert">${esc(r.error)}</p>` : ""}</div>
     ${r.dev ? `<div class="Pairing_preview">${kindIcon(r.dev)}<span><b>${esc(nm(r.dev))}</b> <span class="Pairing_foundMeta">${esc(DEV[r.dev].platform)} · ${shortFp(DEV[r.dev].fp)}</span></span></div>` : ""}
     ${r.dev && r.via ? `<p class="Pairing_grant">This ${esc(hw())} can reach ${esc(nm(r.dev))} over <b>${esc(NET[r.via].word === "home network" ? title(me(), r.via) : NET[r.via].word)}</b>.${isSetUp(me()) ? "" : ` Pairing makes that this ${esc(hw())}’s mesh network.`}</p>` : ""}
     ${r.dev && !r.via ? noSharedNetworkTips(`${esc(nm(r.dev))} is reachable over <b>${r.nets.map(esc).join("</b> and <b>")}</b>. This ${esc(hw())} ${r.nets.length > 1 ? "is on neither" : "isn’t on it"} right now.`) : ""}
     ${already ? `<p class="Pairing_help">${esc(nm(r.dev))} is already paired here. This updates where this ${esc(hw())} looks for it.</p>` : ""}
     ${isModelled(other()) && isSetUp(other()) ? `<div class="Mock_sim"><b>MOCKUP</b> ${btn(`Fill ${esc(nm(other()))}’s code`, fill)}</div>` : ""}`,
    cancelBtn() + (already ? btn("Update addresses", () => { closeDialog(); toast(`Updated ${nm(r.dev)}`, "This device will look for it at the addresses in the code."); }, { variant: "primary", size: "md" })
      : btn(r.dev && !r.via ? "Check again" : "Ask to pair", () => {
          if (!r.via) { render(); return; }
          const fresh = !isSetUp(me()), netName = NET[r.via].word === "home network" ? title(me(), r.via) : NET[r.via].word;
          if (fresh) setNets(me(), [r.via]);
          S.pending = { from: me(), to: r.dev, via: "code", state: "waiting", level: SUGGEST[kindOf(me())] }; closeDialog();
          toast(`Asked ${nm(r.dev)}`, `Approve it on ${nm(r.dev)}.${fresh ? ` Your mesh network is now ${netName}.` : ""}`);
        }, { variant: "primary", size: "md", disabled: !r.dev })));
}

/* ====================================================== settings page == */

const NAV_LABEL = { profiles: "Profiles", sessions: "New sessions", models: "Agents & models", workspaces: "Workspaces", devices: "Paired devices", pipelines: "Pipelines", synthesis: "Synthesis", appearance: "Appearance", editor: "Editor", credentials: "Credentials & environment", experimental: "Experimental", system: "System", about: "About mads" };

        + btn("Other networks…", () => openDialog({ type: "setup", step: 1, pick: [], all: true, multi: false }), { variant: "ghost", size: "md" })

}

  const warn = here.length === nets.length ? "" : `<div class="MeshNetwork_warn"><div class="Banner_banner Banner_warn"><span class="Banner_icon">!</span><div class="Banner_message"><span class="Banner_title">This ${h} isn’t on ${nets.filter((id) => !here.includes(id)).map((id) => esc(title(dev, id))).join(" or ")} right now.</span><span class="Banner_description">${here.length ? "Devices reach it on its other network." : `Your devices can’t reach it, and it can only reach devices on networks it’s on. ${nets.includes("tailscale") ? "Turn Tailscale back on." : "Go back to that network, or choose a VPN such as Tailscale under Change…"}`}</span></div><span></span></div></div>`;

    ${nets.includes("tailscale") ? settingRow({ label: "Check Tailscale identity", htmlFor: "ts-check", tagHtml: infoTip("Check Tailscale identity", "Asks Tailscale who each connection is from. It can turn a device away. It never lets one in, and never changes what a device may do here."), help: "Only accept devices signed in to your tailnet as you.", control: sw("ts-check", !!s.check, (v) => { s.check = v; render(); }) }) : ""}
    ${settingRow({ label: "Also reachable from the internet", htmlFor: "pub", tagHtml: s.public ? tag("warn", "Less safe") : "", help: s.public ? "Anyone on the internet can try to connect. Only devices you add get in." : "Off. Most people never need this: a VPN reaches your devices from anywhere.", control: sw("pub", !!s.public, (v) => { if (v) openDialog({ type: "public" }); else { s.public = false; render(); } }) })}
    ${settingRow({ label: "Port", help: "The same on every network.", control: `<code>${PORT}</code>` })}
  </div></div></details>`;
  const tsBanner = !nets.includes("tailscale") ? "" : tsOut(dev)

    : tsExpiring(dev) || dev === "pop"
      ? `<div class="MeshNetwork_warn"><div class="Banner_banner ${tsExpiring(dev) ? "Banner_warn" : "Banner_info"}"><span class="Banner_icon">${tsExpiring(dev) ? "!" : "i"}</span><div class="Banner_message"><span class="Banner_title">${tsExpiring(dev) ? `Tailscale signs this ${h} out in 5 days` : `Tailscale signs this ${h} out on Mar 3`}</span><span class="Banner_description">For a machine you reach remotely, turn off key expiry so it stays reachable.</span></div><span><a class="Button_button Button_secondary Button_sm" href="${TS_ADMIN}" target="_blank" rel="noopener">Open Tailscale admin</a></span></div></div>`
      : "";
  return `<div class="SettingsCard_card MeshNetwork_card" id="mesh-network"><div class="MeshNetwork_main"><span class="NetChoice_icon" aria-hidden="true">${NET_ICON[NET[primary].icon]}</span>
      <div><div class="MeshNetwork_label">Mesh network</div><div class="MeshNetwork_value">${nets.map((id) => esc(title(dev, id))).join(" + ")}</div><div class="MeshNetwork_meaning">${esc(NET[primary].meaning)} ${esc(NET[primary].safety)}</div></div>
      <span class="MeshNetwork_state">${tsOut(dev) && nets.includes("tailscale") ? `${dot("PairedDevices_bad")}Signed out` : state}</span>${btn("Change…", () => openDialog({ type: "setup", step: 1, change: true, pick: nets.slice(), multi: nets.length > 1 }), { id: "change-net" })}</div>${tsBanner}${warn}${adv}</div>`;
}
function deviceAdvanced(p, idp) {
  const chatOn = p.level === "chat", ctlOn = p.level === "control" || p.level === "admin";
  return `<div class="SettingsCard_card">
    ${settingRow({ label: "Messages to Full access sessions", labelId: `${idp}-chat-l`, help: chatOn ? "" : "Only matters at chat with.", control: seg(`${idp}-chat`, p.chat, [["allowed", "Allowed"], ["refused", "Refused"]], (v) => setLimit(p.dev, "chat", v), "Messages to Full access sessions", !chatOn) })}
    ${settingRow({ label: "Highest session trust", labelId: `${idp}-trust-l`, help: ctlOn ? "" : "Only matters at control or administer.", control: listbox(`${idp}-trust`, { value: p.maxTrust, labelledBy: `${idp}-trust-l`, options: TRUST.map(([v, l]) => ({ value: v, label: l })), onPick: (v) => setLimit(p.dev, "maxTrust", v), disabled: !ctlOn }) })}

    <div class="TableC_detailFoot"><span>Paired ${esc(p.pairedAt)}</span><span class="DeviceRow_spacer"></span>${btn("Remove device…", () => {}, { title: "Unchanged from paired-devices-v3" })}</div></div>`;
}
function deviceTable() {
  const ps = H().peers, h = esc(hw());
  if (!ps.length) return `<div class="SettingsCard_card"><div class="SettingRow_row"><div class="SettingRow_text"><span class="SettingRow_label">No devices yet</span><div class="SettingRow_help">Use <b>Add devices</b> above. Each one is approved on the device itself.</div></div></div></div>`;
  const rows = ps.map((p) => {
    const id = p.dev, prob = problem(p), open = U().row === id || (U().row === undefined && prob);
    const toggle = on((el, e) => {
      if (e && e.target.closest("button:not(.TableC_nameBtn), [role=switch], .Select_listbox, .LevelPicker_listbox, .Tooltip_anchor[tabindex]")) return;
      U().row = open ? null : id; render(); document.getElementById(`row-${id}`)?.focus();
    });
    const kh = onKey((e) => { if (e.target.id === `row-${id}` && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); U().row = open ? null : id; render(); document.getElementById(`row-${id}`)?.focus(); } });
    const row = `<tr class="TableC_row" id="row-${id}" tabindex="0" aria-expanded="${open}" aria-controls="detail-${id}" data-h="${toggle}" data-k="${kh}" ${prob ? "data-problem" : ""}>
      <td><span class="TableC_nameBtn">${kindIcon(id)}${esc(nm(id))}</span></td>
      <td>${listbox(`verb-${id}`, { value: p.level, verb: true, ariaLabel: `What ${nm(id)} may do with mads on this ${hw()}`, options: verbOptions(), onPick: (v) => setLevel(id, v) })}</td>
      <td class="TableC_letsCol">${letsCell(p)}</td><td>${showSwitchCell(p, `show-${id}`)}</td><td>${statusCell(p)}</td><td class="TableC_chev">${caret()}</td></tr>`;
    const detail = !open ? "" : `<tr class="TableC_detailRow" id="detail-${id}"><td colspan="6"><div class="TableC_detail">${troubleshoot(p)}
        <div><div class="Drawer_title">Advanced options</div>${deviceAdvanced(p, `adv-${id}`)}</div>
        <div><div class="Drawer_title">Activity</div><div class="SettingsCard_card">${activityList(id)}</div></div></div></td></tr>`;
    return row + detail;
  }).join("");
  return `<div class="SettingsCard_card TableC_wrap"><table class="TableC_table"><thead><tr><th>Device</th><th>May … mads on this ${h}</th><th class="TableC_letsCol">Lets this ${h} …</th><th>Show sessions</th><th class="TableC_statusHead">Status</th><th><span class="sr-only">Details</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
const TYPE_CHIP = { paired: ["ok", "Paired"], level: ["neutral", "Level"], network: ["neutral", "Network"], refused: ["bad", "Refused"] };
function activityList(dev) {
  const items = H().log.filter((e) => dev === "all" || e.dev === dev);

  return `<ul class="Activity_list">${items.slice(0, 10).map((e) => `<li class="Activity_item">${chip(...TYPE_CHIP[e.type])}<span>${e.dev ? `<b>${esc(nm(e.dev))}</b> ` : ""}${e.text}</span><time>${e.t}</time></li>`).join("")}</ul>`;
}
function activityCard() {
  if (!H().log.length) return "";
  const devs = [...new Set(H().log.map((e) => e.dev).filter(Boolean))];
  const opts = [{ value: "all", label: "All devices" }, ...devs.map((d) => ({ value: d, label: nm(d) }))];
  return `<div class="SettingsCard_card"><div class="Activity_head"><h3 class="SettingsCard_title">Device activity</h3>${listbox("act-filter", { value: U().filter, ariaLabel: "Show activity from", options: opts, onPick: (v) => { U().filter = v; } })}</div>${activityList(U().filter)}</div>`;
}
function renderSettings() {
  const nav = `<nav class="ScrollSpyNav_nav" aria-label="Settings sections">${NAV.map((g, i) => (i ? `<div class="ScrollSpyNav_separator" role="separator"></div>` : "") + g.map((id) => `<button type="button" class="ScrollSpyNav_item" ${id === "devices" ? `aria-current="page"` : `data-inert title="Not part of this mockup"`}>${NAV_LABEL[id]}</button>`).join("")).join("")}</nav>`;
  const body = isSetUp(me()) ? `${thisDeviceBar()}${meshNetworkCard()}${deviceTable()}${activityCard()}` : `${thisDeviceBar()}${emptyState()}`;
  return `<div class="SettingsSurface_surface">${nav}<div class="SettingsSurface_main"><div class="SettingsSurface_body" id="settings-body"><div class="ContentColumn_column ContentColumn_wide">
    <section id="devices" class="SettingsSurface_section"><h2 class="SettingsSurface_heading">Paired devices</h2>
      <p class="SettingsSurface_lede">What your other devices may do with mads on this ${esc(hw())}, and whose sessions show here. Each device sets this for itself.</p>
      <div class="PairedDevices_panel">${body}</div></section></div></div></div></div>`;
}

/* ============================================================ render == */
function mockBar() {
  const b = (label, pressed, fn) => `<button type="button" class="Mock_btn" aria-pressed="${pressed}" data-h="${on(fn)}">${label}</button>`;
  const set = (k, v) => () => { S[k] = v; S.menu = null; S.fp = null; render(); };
  return `<div class="Mock_bar" role="toolbar" aria-label="Mockup controls (not part of the app)"><span class="Mock_tag">MOCKUP</span>
    <div class="Mock_group"><span>Theme</span>${b("Dark", S.theme === "dark", set("theme", "dark"))}${b("Light", S.theme === "light", set("theme", "light"))}</div><span class="Mock_sep"></span>
    <div class="Mock_group"><span>I am</span>${b("MacBook-Air", S.me === "mac", set("me", "mac"))}${b("pop-os", S.me === "pop", set("me", "pop"))}</div><span class="Mock_sep"></span>
    <div class="Mock_group"><span>Start</span>${b("Fresh", false, () => { S = Object.assign(seed("fresh", S.theme), { tailnet: S.tailnet, macAt: S.macAt, popTs: S.popTs }); render(); })}${b("Meshed", false, () => { S = Object.assign(seed("meshed", S.theme), { tailnet: S.tailnet, macAt: S.macAt, popTs: S.popTs }); render(); })}</div><span class="Mock_sep"></span>
    <div class="Mock_group"><span>Tailscale</span>${b("Present", S.tailnet, set("tailnet", true))}${b("Absent", !S.tailnet, set("tailnet", false))}</div><span class="Mock_sep"></span>
    <div class="Mock_group"><span>MacBook on</span>${b("Home Wi-Fi", S.macAt === "home", set("macAt", "home"))}${b("Campus Wi-Fi", S.macAt === "campus", set("macAt", "campus"))}</div><span class="Mock_sep"></span>
    <div class="Mock_group">${b("pop-os offline", S.popOffline, () => { S.popOffline = !S.popOffline; render(); })}</div><span class="Mock_sep"></span>
    <div class="Mock_group"><span>pop-os Tailscale</span>${b("OK", S.popTs === "ok", set("popTs", "ok"))}${b("Expiring", S.popTs === "expiring", set("popTs", "expiring"))}${b("Signed out", S.popTs === "signedout", set("popTs", "signedout"))}</div>
    <span class="Mock_note">docs/MESH-NETWORK-DESIGN.md</span></div>`;
}
function render() {
  HANDLERS = {}; KEYS = {}; hc = 0; tipN = 0;
  const focusId = document.activeElement?.id;
  const scroll = document.getElementById("settings-body")?.scrollTop;
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("mockbar").innerHTML = mockBar();
  const t = S.toast;
  const toastHtml = t && t.dev === S.me ? `<div class="Toast_viewport"><div class="Toast_toast Toast_${t.tone}" role="status" ${Date.now() - t.at > 250 ? `style="animation:none"` : ""}><div class="Toast_title">${esc(t.title)}</div>${t.desc ? `<div class="Toast_description">${esc(t.desc)}</div>` : ""}<button type="button" class="Toast_x" aria-label="Dismiss" data-h="${on(() => { S.toast = null; render(); })}">✕</button></div></div>` : "";
  document.getElementById("app").innerHTML = `<div class="App_shell">${iconRail("settings")}<div class="App_main"><div class="App_surface">${renderSettings()}${toastHtml}</div></div></div>` + renderDialog();
  if (scroll) { const sb = document.getElementById("settings-body"); if (sb) sb.scrollTop = scroll; }
  if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
}
/* ============================================================= events == */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-h]");
  if (el && el.hasAttribute("data-backdrop") && e.target.closest("[data-stop]")) { closeMenus(e); return; }
  if (el && !el.disabled) { if (!el.closest("[data-hover]")) closeMenus(e, true); HANDLERS[el.dataset.h]?.(el, e); return; }
  closeMenus(e);
});
function closeMenus(e, quiet) {
  let changed = false;
  if (S.menu && !e.target.closest(".Select_root, .LevelPicker_root, .VerbPicker_root")) { S.menu = null; changed = true; }
  if (S.fp && !e.target.closest(".Popover_root")) { S.fp = null; changed = true; }
  if (changed && !quiet) render();
}
document.addEventListener("toggle", (e) => { const k = e.target.dataset?.adv; if (k) U().open[k] = e.target.open; }, true);
document.addEventListener("mouseover", (e) => {
  const li = e.target.closest("[data-hover]"); if (!li || !S.menu) return;
  const [id, i] = li.dataset.hover.split(":"); if (S.menu.id !== id || S.menu.hi === +i) return;
  S.menu.hi = +i;
  li.parentElement.querySelectorAll("[data-hover]").forEach((x) => x.classList.toggle(x.classList.contains("Select_option") ? "Select_optionHighlighted" : "LevelPicker_optionHighlighted", x === li));
});
document.addEventListener("keydown", (e) => {
  const k = e.target.closest?.("[data-k]");
  if (k) { KEYS[k.dataset.k]?.(e); if (e.defaultPrevented) return; }
  if (e.key === "Escape") {
    if (S.menu) { S.menu = null; render(); return; }
    if (S.fp) { const id = S.fp; S.fp = null; render(); document.getElementById(id)?.focus(); return; }
    const d = curDialog();
    if (d) { document.querySelector(".Dialog_backdrop")?.click(); return; }
    if (U().row) { const id = U().row; U().row = null; render(); document.getElementById(`row-${id}`)?.focus(); return; }
  }
  if (e.key === "Tab" && curDialog()) {
    const f = [...document.querySelectorAll(".Dialog_dialog button:not([disabled]), .Dialog_dialog input:not([disabled]), .Dialog_dialog textarea")].filter((x) => x.tabIndex !== -1);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
  const r = e.target.closest?.('[role="radio"]');
  if (r && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
    const all = [...r.parentElement.children], i = all.indexOf(r), d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
    const next = all[(i + d + all.length) % all.length]; e.preventDefault(); HANDLERS[next.dataset.h]?.(next); document.getElementById(next.id)?.focus();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "composer") { S.draft = e.target.value; return; }
  const f = e.target.dataset?.input, d = U().dialog;
  if (f && d) { d[f] = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById(e.target.id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset?.net; if (!id) return;
  let n = chosen(me()).slice();
  n = e.target.checked ? [...n, id] : n.filter((x) => x !== id);
  if (!n.length) { toast("Keep at least one network", "Or this device can’t be reached at all.", "info"); return; }
  setNets(me(), n); render();
});
setInterval(() => {
  for (const h of Object.keys(S.codes)) { const c = S.codes[h]; if (c.left > 0) c.left--; }
  const c = S.codes[me()], d = U().dialog;
  if (d?.type === "copy" && c) { const t = document.getElementById("code-left"); if (t) t.textContent = `Works once · expires in ${mm(c.left)}`; }
}, 1000);
render();
</script>
